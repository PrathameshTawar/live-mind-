<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#C4B5FD" />
    </linearGradient>
    <filter id="brainGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Apple-Style Rounded Squircle Backdrop — Indigo Violet -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#100E1C" stroke="rgba(196, 181, 253, 0.4)" stroke-width="1.5" />
  
  <!-- Subtle Matrix Circuit Lines -->
  <path d="M 16 32 L 24 32 L 32 20 L 40 44 L 48 32" stroke="rgba(196, 181, 253, 0.45)" stroke-width="2" stroke-linecap="round" />
  
  <!-- Neural Cortex Core -->
  <circle cx="32" cy="24" r="6" fill="url(#brainGrad)" filter="url(#brainGlow)" />
  <circle cx="24" cy="38" r="5" fill="url(#brainGrad)" />
  <circle cx="40" cy="38" r="5" fill="url(#brainGrad)" />
  <path d="M 32 24 L 24 38 M 32 24 L 40 38 M 24 38 L 40 38" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
</svg>
